<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Ingresar | Vertigo</title>
  <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700" rel="stylesheet">
  <link rel="stylesheet" href="css/ionicons.min.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <!-- DOC: PÁGINA DE INGRESO Y REGISTRO. Es la puerta de entrada del sitio: si el usuario es administrador, js/login.js lo manda automáticamente al panel (dashboard/index.html); si es cliente, vuelve a la página desde la que vino (o al inicio). Estilos en css/login.css. -->
  <main class="auth-wrap">
    <div class="auth-card">
      <a href="index.html" class="auth-brand">Vertigo.</a>
      <p class="auth-sub" id="auth-sub">Ingresá a tu cuenta para reservar tus excursiones</p>

      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-tab active" id="tab-ingresar" role="tab">Ingresar</button>
        <button type="button" class="auth-tab" id="tab-crear" role="tab">Crear cuenta</button>
      </div>

      <!-- DOC: FORMULARIO DE INGRESO. Valida email y contraseña contra Datos.login() (js/datos.js). -->
      <form id="form-ingresar" novalidate>
        <div class="auth-field">
          <label for="li-email">Email</label>
          <input type="email" id="li-email" autocomplete="email" placeholder="nombre@correo.com">
          <div class="auth-error"></div>
        </div>
        <div class="auth-field">
          <label for="li-pass">Contraseña</label>
          <div class="auth-pass">
            <input type="password" id="li-pass" autocomplete="current-password" placeholder="Tu contraseña">
            <button type="button" class="auth-eye" data-ver="li-pass" aria-label="Mostrar contraseña"><span class="ion-ios-eye"></span></button>
          </div>
          <div class="auth-error"></div>
        </div>
        <div class="auth-alert" id="li-alerta" hidden></div>
        <div class="auth-ok" id="li-ok" hidden></div>
        <button type="submit" class="auth-btn">Ingresar</button>
        <a href="#" class="auth-link" id="ir-recuperar">¿Olvidaste tu contraseña?</a>
      </form>

      <!-- DOC: RECUPERAR CONTRASEÑA (sin correo). El cliente confirma su identidad con el email y su DNI o teléfono
           cargados al registrarse; si coinciden, elige una contraseña nueva (Datos.recuperarPassword -> api/recuperar.php). -->
      <form id="form-recuperar" novalidate hidden>
        <p class="auth-help">Ingresá tu email y tu DNI <em>o</em> teléfono (el que cargaste al crear la cuenta) y elegí una contraseña nueva.</p>
        <div class="auth-field">
          <label for="rc-email">Email</label>
          <input type="email" id="rc-email" autocomplete="email" placeholder="nombre@correo.com">
          <div class="auth-error"></div>
        </div>
        <div class="auth-field">
          <label for="rc-dato">DNI o teléfono</label>
          <input type="text" id="rc-dato" autocomplete="off" placeholder="Solo números">
          <div class="auth-error"></div>
        </div>
        <div class="auth-field">
          <label for="rc-pass">Contraseña nueva</label>
          <div class="auth-pass">
            <input type="password" id="rc-pass" autocomplete="new-password" placeholder="Mínimo 4 caracteres">
            <button type="button" class="auth-eye" data-ver="rc-pass" aria-label="Mostrar contraseña"><span class="ion-ios-eye"></span></button>
          </div>
          <div class="auth-error"></div>
        </div>
        <div class="auth-alert" id="rc-alerta" hidden></div>
        <button type="submit" class="auth-btn">Cambiar contraseña</button>
        <a href="#" class="auth-link" id="volver-ingresar">&larr; Volver a ingresar</a>
      </form>

      <!-- DOC: FORMULARIO DE REGISTRO. Crea una cuenta de CLIENTE (Datos.registrar). Los administradores se crean desde el panel, nunca desde acá. -->
      <form id="form-crear" novalidate hidden>
        <div class="auth-row">
          <div class="auth-field">
            <label for="cr-nombre">Nombre</label>
            <input type="text" id="cr-nombre" autocomplete="given-name">
            <div class="auth-error"></div>
          </div>
          <div class="auth-field">
            <label for="cr-apellido">Apellido</label>
            <input type="text" id="cr-apellido" autocomplete="family-name">
            <div class="auth-error"></div>
          </div>
        </div>
        <div class="auth-field">
          <label for="cr-email">Email</label>
          <input type="email" id="cr-email" autocomplete="email" placeholder="nombre@correo.com">
          <div class="auth-error"></div>
        </div>
        <div class="auth-row">
          <div class="auth-field">
            <label for="cr-tel">Teléfono <small>(opcional)</small></label>
            <input type="tel" id="cr-tel" autocomplete="tel">
            <div class="auth-error"></div>
          </div>
          <div class="auth-field">
            <label for="cr-dni">DNI <small>(opcional)</small></label>
            <input type="text" id="cr-dni" inputmode="numeric" maxlength="10">
            <div class="auth-error"></div>
          </div>
        </div>
        <div class="auth-field">
          <label for="cr-pass">Contraseña</label>
          <div class="auth-pass">
            <input type="password" id="cr-pass" autocomplete="new-password" placeholder="Mínimo 4 caracteres">
            <button type="button" class="auth-eye" data-ver="cr-pass" aria-label="Mostrar contraseña"><span class="ion-ios-eye"></span></button>
          </div>
          <div class="auth-error"></div>
        </div>
        <div class="auth-alert" id="cr-alerta" hidden></div>
        <button type="submit" class="auth-btn">Crear cuenta</button>
      </form>

      <a href="index.html" class="auth-back">&larr; Volver al sitio</a>
    </div>
  </main>

  <script src="js/datos.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
