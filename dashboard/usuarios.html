<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuarios | Vertigo Admin</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.ico">
  <link rel="stylesheet" href="assets/libs/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/libs/bootstrap-icons/bootstrap-icons.css">
  <link rel="stylesheet" href="assets/libs/apexcharts/apexcharts.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/admin.css">
  <!-- DOC: ORDEN IMPORTANTE. datos.js (datos simulados) y layout.js (acceso solo para administradores + menú) se cargan en el head, antes de dibujar la página. -->
  <script src="../js/datos.js"></script>
  <script src="assets/js/layout.js"></script>
</head>
<body data-pagina="usuarios" data-titulo="Usuarios" data-subtitulo="Clientes y administradores del sistema.">

  <div id="acciones"><button class="btn-custom btn-custom-primary" id="btn-nueva"><i class="bi bi-person-plus"></i> Nuevo usuario</button></div>
  <div id="contenido">
    <!-- DOC: TABLA. Buscador y filtro arriba; las filas las dibuja admin.js dentro de #tabla-cuerpo (una fila por registro). Los botones de cada fila usan data-acc para indicar la acción. -->
    <div class="table-card-custom">
      <div class="table-header-control">
        <div class="table-search-box"><i class="bi bi-search table-search-icon"></i>
          <input type="text" class="table-search-input" id="buscar" placeholder="Buscar por nombre, email o DNI..."></div>
        <div class="table-filter-group"><select class="form-select-custom form-control-custom-sm" id="filtro-rol" aria-label="Filtrar por rol"><option value="">Todos los roles</option><option value="1">Administradores</option><option value="2">Clientes</option></select></div>
      </div>
      <div class="table-responsive">
        <table class="table-custom">
          <thead><tr><th>Usuario</th><th>Rol</th><th>Contacto</th><th>Ciudad</th><th>Reservas</th><th>Estado</th><th><span class="d-block text-center">Acciones</span></th></tr></thead>
          <tbody id="tabla-cuerpo"></tbody>
        </table>
      </div>
      <div class="table-footer-control"><span class="table-pagination-info" id="cuenta"></span></div>
    </div>
  </div>

  <!-- DOC: Librerías (Bootstrap para modales y menús, ApexCharts para gráficos) y la lógica de las pantallas (admin.js). admin.js elige qué módulo ejecutar según data-pagina del body. -->
  <script src="assets/libs/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
